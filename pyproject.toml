[build-system]
build-backend = 'setuptools.build_meta'
requires = ['setuptools>=64', 'setuptools_scm>=8']

[dependency-groups]
dev = ['pre-commit', 'pytest', 'pytest-cov']

[project]
authors = [{ name = 'Erik Bedard' }]
classifiers = [
  'Development Status :: 4 - Beta',
  'Environment :: MacOS X',
  'Intended Audience :: Developers',
  'Intended Audience :: Science/Research',
  'Operating System :: MacOS :: MacOS X',
  'Programming Language :: Python :: 3',
  'Programming Language :: Python :: 3.10',
  'Programming Language :: Python :: 3.11',
  'Programming Language :: Python :: 3.12',
  'Programming Language :: Python :: 3.13',
  'Programming Language :: Python :: 3.14',
  'Topic :: Scientific/Engineering :: Visualization',
]
dependencies = []
description = 'Quick Look previews for PyVista-readable mesh files.'
dynamic = ['version']
keywords = ['macos', 'mesh', 'preview', 'pyvista', 'quicklook', 'vtk']
license = 'MIT'
name = 'pyvista-quicklook'
readme = 'README.md'
requires-python = '>=3.10'

[project.scripts]
pvql = 'pvql.cli:main'

[project.urls]
Homepage = 'https://github.com/user27182/pyvista-quicklook'

[tool.coverage.run]
branch = true
omit = ['*/_scene_export.py', '*/_version.py', '*/_warmup.py']
parallel = true
source = ['pvql']

[tool.pytest.ini_options]
addopts = '--cov=pvql --cov-fail-under=50'
testpaths = 'tests'

[tool.ruff]
indent-width = 4
line-length = 99

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 75
quote-style = 'single'

[tool.ruff.lint]
extend-select = [
  'A',
  'B',
  'C4',
  'D',
  'E',
  'EM',
  'F',
  'FA',
  'I',
  'ICN',
  'N',
  'PERF',
  'PGH',
  'PIE',
  'PT',
  'RET',
  'RSE',
  'RUF',
  'SIM',
  'T10',
  'T20',
  'TCH',
  'TID',
  'UP',
  'W',
  'YTT',
]
ignore = ['D203', 'D211', 'D213']

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = true
force-sort-within-sections = true
required-imports = ['from __future__ import annotations']

[tool.ruff.lint.per-file-ignores]
# The command line interface reports its findings on stdout.
'src/pvql/cli.py' = ['T201']
'tests/*' = ['D103']

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.setuptools]
license-files = ['LICENSE']

[tool.setuptools.packages.find]
where = ['src']

[tool.setuptools_scm]
version_scheme = 'release-branch-semver'
write_to = 'src/pvql/_version.py'
